name: Build and validate EcoAPI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Analyze and build EcoAPI
    runs-on: ubuntu-24.04
    steps:
      - name: Check out EcoAPI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out pinned Axolotl-PM source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: axolotl-pm/PocketMine-MP
          ref: dfe0d07e48a9e8d5a4a242fa43ff1cd3b743a955
          path: .devtools-dependencies/axolotl-pm
          persist-credentials: false

      - name: Check out Axolotl-PM 5.0.0 API-floor source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: axolotl-pm/PocketMine-MP
          ref: b16cc69974d4e805d21e6328ab77c0e17cd7116d # Axolotl-PM 5.0.0
          path: .devtools-dependencies/axolotl-pm-api-floor
          persist-credentials: false

      - name: Check out pinned provider APIs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NhanAZ-Plugins/SimpleEconomy
          ref: b715399a29b707a8ccdae559d48bbda2c37b7b49
          path: .devtools-dependencies/SimpleEconomy
          persist-credentials: false

      - name: Check out BedrockEconomy API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cooldogepm/BedrockEconomy
          ref: d2413682c965c02e6980e6e285004aa3a5f62743
          path: .devtools-dependencies/BedrockEconomy
          persist-credentials: false

      - name: Check out EconomyAPI for PocketMine-MP 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ACM-PocketMine-MP/EconomyAPI
          ref: d96e269de09da7494690b7fa459b5168880fc671
          path: .devtools-dependencies/EconomyAPI
          persist-credentials: false

      - name: Check out Axolotl PHP setup helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: axolotl-pm/setup-php-action
          ref: b8c3f9add4f2ad4a5e2624a1112aba899ee8db0e
          path: .devtools-dependencies/setup-php-action
          persist-credentials: false

      - name: Set up Axolotl PHP on Node.js 24
        shell: bash
        env:
          INPUT_PHP-VERSION: "8.1"
          INPUT_PM-VERSION-MAJOR: "5"
          INPUT_INSTALL-PATH: ./.php-bin
        run: node "$GITHUB_WORKSPACE/.devtools-dependencies/setup-php-action/dist/index.js"

      - name: Validate and install locked Composer dependencies
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins

      - name: Install Axolotl-PM 5.0.0 runtime dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress
        working-directory: .devtools-dependencies/axolotl-pm-api-floor

      - name: Analyze EcoAPI and example at PHPStan max
        run: composer phpstan

      - name: Test provider money handling
        run: composer test

      - name: Lint PHP source and tests
        shell: bash
        run: find src example/src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build verified companion plugin PHAR
        id: build
        uses: NhanAZ/DevTools@8d13a75aaf4f330fdbd93737d58be9cacc41e262 # v1.0.15
        with:
          project: .
          output: build
          phpstan: max
          phpstan-server: .devtools-dependencies/axolotl-pm
          phpstan-paths: |
            .devtools-dependencies/SimpleEconomy/src
            .devtools-dependencies/BedrockEconomy/src
            .devtools-dependencies/EconomyAPI/src

      - name: Verify PHAR manifest, source and digest
        shell: bash
        env:
          PHAR_PATH: ${{ steps.build.outputs.phar }}
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          set -euo pipefail
          php -r '$p=new Phar(getenv("PHAR_PATH")); foreach(["plugin.yml","LICENSE","src/NhanAZ/EcoAPI/EcoAPI.php","src/NhanAZ/EcoAPI/provider/XPProvider.php"] as $f){if(!$p->offsetExists($f)){throw new RuntimeException("Missing PHAR entry: ".$f);}} $m=json_decode(file_get_contents(getenv("BUILD_METADATA")),true,512,JSON_THROW_ON_ERROR); if(hash_file("sha256",getenv("PHAR_PATH"))!==$m["data"]["sha256"]){throw new RuntimeException("PHAR digest mismatch");}'
          cp "$BUILD_METADATA" build/devtools-build.json

      - name: Smoke test plugin startup on Axolotl-PM 5.0.0
        env:
          AXOLOTL_SOURCE: .devtools-dependencies/axolotl-pm-api-floor
          PLUGIN_PHAR: ${{ steps.build.outputs.phar }}
          PLUGIN_SHA256: ${{ steps.build.outputs.sha256 }}
        run: python3 tests/api-floor-runtime-smoke.py

      - name: Prepare EcoAPI virion for consumer build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .devtools-virions/EcoAPI
          cp virion.yml LICENSE .devtools-virions/EcoAPI/
          cp -R src .devtools-virions/EcoAPI/

      - name: Build example with shaded EcoAPI
        id: example-build
        uses: NhanAZ/DevTools@8d13a75aaf4f330fdbd93737d58be9cacc41e262 # v1.0.15
        with:
          project: example
          virions: .devtools-virions
          output: build/example
          phpstan: max
          phpstan-server: .devtools-dependencies/axolotl-pm
          phpstan-paths: |
            .devtools-virions/EcoAPI/src
            .devtools-dependencies/SimpleEconomy/src
            .devtools-dependencies/BedrockEconomy/src
            .devtools-dependencies/EconomyAPI/src

      - name: Verify shaded example artifact
        shell: bash
        env:
          PHAR_PATH: ${{ steps.example-build.outputs.phar }}
          PHAR_SHA256: ${{ steps.example-build.outputs.sha256 }}
        run: |
          set -euo pipefail
          test -s "$PHAR_PATH"
          test "$(sha256sum "$PHAR_PATH" | cut -d ' ' -f 1)" = "$PHAR_SHA256"

      - name: Upload verified PHAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EcoAPI-${{ github.sha }}
          path: |
            ${{ steps.build.outputs.phar }}
            ${{ steps.example-build.outputs.phar }}
            build/devtools-build.json
          if-no-files-found: error
          retention-days: 14
